<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="tela">
        <div class="sidebar">
            <img src="images/painel-de-controle.png" alt="#">
            <h3>Dashboard</h3>
            <ul class="perfil">
                <li>
                    <img src="images/botao-home.png" alt="#">
                    <p>Home</p>
                </li>
                <li>
                    <img src="images/profiles.png" alt="#">
                    <p>Profile</p>
                </li>
                <li>
                    <img src="images/failed-message.png" alt="#">
                    <p>Message</p>
                </li>
                <li>
                    <img src="images/history.png" alt="#">
                    <p>History</p>
                </li>
                <li>
                    <img src="images/tasks.png" alt="#">
                    <p>Tasks</p>
                </li>
                <li>
                    <img src="images/comunidades.png" alt="#">
                    <p>Communities</p>
                </li>
                </ul>

            <ul class="suporte">
                <li>
                    <img src="images/settings.png" alt="#">
                    <p>Settings</p>
                </li>
                <li>
                    <img src="images/tech-support.png" alt="#">
                    <p>Support</p>
                </li>
                <li>
                    <img src="images/privacy-policy.png" alt="#">
                    <p>Privacy</p>
                </li>
            </ul>
        </div>
        <div class="main">
            <div class="header">
                <div class="pesquisa">
                    <div class="busca">
                        <img src="images/big-search-len.png" alt="">
                        <input type="text">
                    </div>
                    <div class="profile">
                        <img src="images/packard-bell.png" alt="">
                        <img src="images/OIP.webp" alt="" id="icone">
                        <p>Jonatas Xavier</p>
                    </div>
                </div>
                <div class="header-inferior">
                    <img src="images/OIP.webp" alt="">
                    <div class="texto">
                        <p>Hi there,</p>
                        <h3>Jonatas Xavier (@jonatas)</h3>
                    </div>
                    <div class="botoes">
                        <button type="button">New</button>
                        <button type="button">Upload</button>
                        <button type="button">Share</button>
                    </div>

                </div>
            </div>
            <div class="principal">
                Principal
            </div>
        </div>
    </div>
</body>
</html>
